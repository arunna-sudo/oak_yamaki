name: dorm_ease
description: "แอปจัดการหอพัก DormEase - โปรเจกต์รวมเนื้อหาจากบทเรียน Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- State Management (Lecture 7) ---
